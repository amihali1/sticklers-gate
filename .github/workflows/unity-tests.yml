name: Unity Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test-editmode:
    name: EditMode Tests
    runs-on: ubuntu-latest
    steps:
      # Unity 6 editor images exceed the runner's default free disk space
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: SticklersGate/Library
          key: Library-EditMode-${{ hashFiles('SticklersGate/Assets/**', 'SticklersGate/Packages/manifest.json') }}
          restore-keys: |
            Library-EditMode-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: SticklersGate
          testMode: EditMode
          unityVersion: 6000.3.10f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: artifacts
